[package]
name = "kamui"
version = "0.1.0"
edition = "2024"
description = "Provider-agnostic LLM chat CLI"
license = "MIT"
repository = "https://github.com/algonacci/kamui"
readme = "README.md"
keywords = ["ai", "cli", "llm", "openai"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29", features = ["event-stream"] }
arboard = { version = "3.4", features = ["image-data"] }
async-trait = "0.1.89"
base64 = "0.23.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
png = "0.18.1"
chrono = "0.4.42"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
directories = "6.0.0"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
ratatui = "0.30"
rmcp = { version = "3.2.0", features = ["client", "transport-child-process"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.5"
tokio = { version = "1.53.1", features = ["full"] }
unicode-width = "0.2"
uuid = { version = "1.19.0", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
